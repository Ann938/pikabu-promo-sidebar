<!doctype html>
<html lang="ru">
<head>
<link rel="icon" href="img/logo-promo.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=1360">
<title>Пикабу Промокоды — блок в сайдбаре</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fc; --clear:#fcfdff; --stroke:#ebedf2; --text:#292a2e; --text2:#5c5f66; --muted:#757880;
  --green:#89cc52; --green-h:#7bbd45; --green2:#78b247; --soft:#f2f3f7;
  --shadow:0 0 1px rgba(41,42,46,.12),0 4px 16px rgba(41,42,46,.08);
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Roboto,system-ui,sans-serif;color:var(--text);min-width:1360px;-webkit-font-smoothing:antialiased}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- страница (макет 24:20952) ---------- */
.hd{position:sticky;top:0;z-index:20;background:var(--clear);box-shadow:0 0 1px rgba(41,42,46,.12),0 2px 10px rgba(41,42,46,.05)}
.hd img{width:1360px;height:64px;margin:0 auto}
.page{width:1360px;margin:0 auto;position:relative;padding-top:16px;padding-bottom:120px}
.feed{position:absolute;left:90px;top:16px;width:780px}
.feed img{width:780px;height:auto}
.feed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(rgba(247,248,252,0),var(--bg))}
.side{margin-left:886px;width:304px;display:flex;flex-direction:column;gap:16px}
.side>img{width:304px;height:auto}

/* ---------- блок промокодов ---------- */
.promo{background:var(--clear);box-shadow:inset 0 0 0 1px var(--stroke);border-radius:16px;padding:16px 24px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.promo__hd{display:flex;align-items:center;gap:8px}
.promo__hd img{width:32px;height:32px}
.promo__hd b{font-weight:600;font-size:16px;line-height:24px}
.stage{position:relative;width:256px;height:180px;touch-action:pan-y;user-select:none}

/* Купон по макету 24:21024 (компонент coupon 48:4734):
   активный 160×160, padding 16, gap 8, radius 12, фон #FCFDFF + shadowMain, текст 12/16 Medium #292A2E;
   лого + заголовок центрируются группой, заголовок максимум 4 строки — карточка всегда 160, ничего не прыгает.
   Соседние — квадрат 126×126 (это 160 × 0.7875), прозрачность 56 %, обводка #EBEDF2: padding 8/16, лого 40 r12,
   gap 4, текст 10/16 #757880, прижато к верху. Внутри карточки размеры заданы в «160-х» единицах (÷0.7875),
   чтобы после масштаба получились ровно макетные. Сцена 180 — всегда фиксированной высоты. */
/* Ховер на активном (вариант condition=hover): 160 → 166, ease-out 0.3 с. */
/* Без скачков: внутри карточки две готовые раскладки — «активная» и «соседняя». При смене купона
   карточка только двигается и масштабируется (transform), а раскладки плавно меняются прозрачностью.
   Размеры шрифтов и отступов не анимируются, поэтому текст не перестраивается и не съезжает. */
.cp{position:absolute;left:0;top:50%;width:160px;height:160px;overflow:hidden;border-radius:12px;
  background:var(--clear);box-shadow:inset 0 0 0 1px var(--stroke);text-align:center;cursor:pointer;
  transform:translate(var(--x), -50%) scale(calc(var(--s) * var(--h, 1)));
  transition:transform .6s var(--ease),opacity .6s var(--ease),box-shadow .4s;will-change:transform,opacity}
.cp__a,.cp__s{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .45s var(--ease)}
.cp__logo{flex:none;background:var(--clear);overflow:hidden}
.cp__logo img{width:100%;height:100%;object-fit:contain}
.cp__t{width:100%;font-weight:500;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
/* активная: padding 16, gap 8, лого 56 r8, текст 12/16 #292A2E, лого + текст по центру */
.cp__a{justify-content:center;gap:8px;padding:16px}
.cp__a .cp__logo{width:56px;height:56px;border-radius:8px}
.cp__a .cp__t{font-size:12px;line-height:16px;color:#292a2e}
/* соседняя (в «160-х» единицах, после scale .7875 = макет): padding 8/16, gap 4, лого 40 r12, текст 10/16 #757880, сверху */
.cp__s{justify-content:flex-start;gap:5.08px;padding:10.16px 20.32px}
.cp__s .cp__logo{width:50.8px;height:50.8px;border-radius:15.24px}
.cp__s .cp__t{font-size:12.7px;line-height:20.32px;color:#757880}
/* сначала быстро гасим старую раскладку, потом проявляем новую — без двоения текста */
.cp.is-active .cp__s,.cp:not(.is-active) .cp__a{opacity:0;transition:opacity .15s ease-out}
.cp.is-active .cp__a,.cp:not(.is-active) .cp__s{opacity:1;transition:opacity .3s ease-out .15s}
.cp.is-active{box-shadow:var(--shadow)}
.cp.is-active:hover{--h:1.0375;transition:transform .3s ease-out,opacity .6s var(--ease),box-shadow .4s}
.cp:not(.is-active):hover{opacity:.75!important}



.nav{display:flex;align-items:center;gap:4px}
.nav span{flex:1;font-size:12px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav button{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;transition:background-color .2s}
.nav button:hover{background:var(--soft)}
.nav button img{width:16px;height:16px}

.cta{height:32px;border-radius:12px;background:var(--green);color:#fcfdff;font-weight:500;font-size:13px;line-height:16px;display:flex;align-items:center;justify-content:center;transition:background-color .2s}
.cta:hover{background:var(--green-h)}
.code{height:32px;border-radius:12px;border:1px dashed var(--green2);background:#f4faef;display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;animation:pop .35s var(--ease)}
.code b{flex:1;font-weight:600;font-size:14px;letter-spacing:.06em}
.code button{font-weight:500;font-size:13px;color:var(--green2);padding:4px 6px;border-radius:8px}
.code button:hover{background:#e8f5dc}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);background:var(--text);color:#fcfdff;font-size:13px;line-height:18px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){.cp,.toast{transition:none}.code{animation:none}}
</style>
</head>
<body>
<header class="hd"><img src="img/header.png" alt="Пикабу — шапка сайта"></header>

<div class="page">
  <div class="feed"><img src="img/content.jpg" alt="Лента постов"></div>

  <aside class="side">
    <img src="img/sb-user.png" alt="Блок пользователя">

    <section class="promo" id="promo" aria-roledescription="карусель" aria-label="Пикабу Промокоды">
      <div class="promo__hd"><img src="img/logo-promo.svg" alt=""><b>Пикабу Промокоды</b></div>
      <div class="stage" id="stage"></div>
      <div id="action"></div>
      <div class="nav">
        <span id="count" aria-live="polite">1 из 9</span>
        <button type="button" id="prev" aria-label="Предыдущий купон"><img src="img/ar-l.svg" alt=""></button>
        <button type="button" id="next" aria-label="Следующий купон"><img src="img/ar-r.svg" alt=""></button>
      </div>
    </section>

    <img src="img/sb-special.png" alt="Сервисы Пикабу">
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // Купоны из фида: только логотип + заголовок (демо-данные)
  const C = [
    ["aliexpress", "Черная пятница со скидками до 90% на все категории товаров", "ALI90"],
    ["litres", "−20% на аудиокниги", "LIT20"],
    ["rivgosh", "Скидка 50% на второй аромат", "RG50"],
    ["citilink", "Выгода до 32 000 ₽ на ноутбуки и смартфоны", "CITI32"],
    ["lemana", "До 10 000 ₽ скидки на всё для ремонта, сада и дачи при заказе на сайте или в приложении", "LEMANA10"],
    ["fitservice", "Скидка 32% на ТО и замену масла", "FIT32"],
    ["pyaterochka", "Минус 500 рублей на первый заказ от 1000 рублей в приложении", "PYAT500"],
    ["sunlight", "Подвеска в подарок по купону в магазинах сети", "SUNGIFT"],
    ["otello", "Выгода до 3000 рублей на отели для новых пользователей", "OTELLO3K"],
  ];
  const N = C.length;
  const $ = (s) => document.querySelector(s);
  const promo = $("#promo"), stage = $("#stage"), count = $("#count"), action = $("#action");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cur = 0, timer = null, paused = false;

  stage.innerHTML = C.map(([l, t], i) => {
      const in_ = `<span class="cp__logo"><img src="img/logos/${l}.png" alt=""></span><span class="cp__t">${t}</span>`;
      return `<div class="cp" data-i="${i}" role="group" aria-label="${t}"><div class="cp__a">${in_}</div><div class="cp__s" aria-hidden="true">${in_}</div></div>`; }).join("");
  const cards = [...stage.children];

  // позиция по смещению от активной: [x, scale, opacity, z]. Сцена 256: активная 160 по центру (x 48),
  // соседи 126×126 прижаты к краям сцены (центр 63 и 193 → x −17 и 113).
  const POS = (o) => o === 0 ? [48, 1, 1, 5] : o === -1 ? [-17, .7875, .56, 3] : o === 1 ? [113, .7875, .56, 3]
    : o < 0 ? [-110, .6, 0, 1] : [206, .6, 0, 1];
  const off = (i) => { let o = (i - cur) % N; if (o > N / 2) o -= N; if (o < -N / 2) o += N; return o; };

  function render() {
    cards.forEach((el, i) => {
      const [x, s, op, z] = POS(off(i));
      el.style.setProperty("--x", x + "px"); el.style.setProperty("--s", s);
      el.style.opacity = op; el.style.zIndex = z;
      el.classList.toggle("is-active", off(i) === 0);
      el.setAttribute("aria-hidden", op === 0);
    });
    count.textContent = `${cur + 1} из ${N}`;
    action.innerHTML = `<button type="button" class="cta" id="show" style="width:100%">Показать промокод</button>`;
    $("#show").onclick = reveal;
  }
  function go(d) { cur = (cur + d + N) % N; render(); }
  function reveal() {
    const [, , code] = C[cur];
    action.innerHTML = `<div class="code"><b>${code}</b><button type="button" id="copy">Скопировать</button></div>`;
    $("#copy").onclick = () => { navigator.clipboard?.writeText(code).catch(() => {}); toast("Промокод скопирован"); };
    toast("Магазин открылся бы в новой вкладке по партнёрской ссылке — это демо");
    stopAuto();
  }
  let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2600); }

  // Автолистание: только 2 раза по 4 с после загрузки, дальше не листаем — чтобы не раздражать.
  // Наведение ставит паузу (отсчёт начнётся заново), любое действие пользователя выключает автолистание совсем.
  const STEP = 4000;
  let autoLeft = reduce ? 0 : 2;
  function schedule() { clearTimeout(timer); if (autoLeft > 0 && !paused) timer = setTimeout(() => { autoLeft--; go(1); schedule(); }, STEP); }
  function stopAuto() { autoLeft = 0; clearTimeout(timer); }

  $("#prev").onclick = () => { stopAuto(); go(-1); };
  $("#next").onclick = () => { stopAuto(); go(1); };
  stage.addEventListener("click", (e) => { const c = e.target.closest(".cp"); if (!c) return; const o = off(+c.dataset.i); stopAuto(); if (o) go(o); else if (!action.querySelector(".code")) reveal(); });
  promo.addEventListener("mouseenter", () => { paused = true; clearTimeout(timer); });
  promo.addEventListener("mouseleave", () => { paused = false; schedule(); });
  // свайп
  let sx = null; stage.addEventListener("pointerdown", (e) => { sx = e.clientX; });
  stage.addEventListener("pointerup", (e) => { if (sx == null) return; const d = e.clientX - sx; sx = null; if (Math.abs(d) > 30) { stopAuto(); go(d < 0 ? 1 : -1); } });

  render(); schedule();
})();
</script>
</body>
</html>
